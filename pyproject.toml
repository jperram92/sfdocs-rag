[project]
name = "sfdocs"
version = "0.1.0"
description = "Crawl official Salesforce documentation, condense it with a local LLM (LM Studio), index it for RAG, and expose it to agents via MCP."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "markdownify>=0.12",
  "pymupdf>=1.24",
  "openai>=1.40",
  "lancedb>=0.13",
  "pyarrow>=15",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "mcp>=1.2",
  "tqdm>=4.66",
  "truststore>=0.9",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
test = ["pytest>=8", "pytest-timeout>=2.3", "playwright>=1.45"]

[project.scripts]
sfdocs = "sfdocs.cli:main"
sfdocs-mcp = "sfdocs.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sfdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["live: hits the real Salesforce documentation site (opt-in with --live)"]
